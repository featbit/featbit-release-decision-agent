# Self-contained stack: web + track-service + their own PostgreSQL + ClickHouse.
# All values are hard-coded — no .env, no variable substitution. To customize
# (passwords, image tag, FeatBit URL, sandbox0 key, etc.), edit this file
# directly.
#
# Quickstart:
#   1. Replace REPLACE_ME below with a long random string. Generate one:
#        macOS / Linux:   openssl rand -base64 48
#        Windows (PS 7+): [Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(48))
#   2. cd modules && docker compose up -d
#   3. open http://localhost:3000

# Shared HMAC-SHA256 key for env-secret signing. web mints tokens, track-service
# validates them — both services MUST see the same value. The anchor below is
# referenced from both service blocks via *signing-key, so you only edit it
# here. Leaving REPLACE_ME makes track-service log a "legacy mode" warning and
# trust the Authorization header as plaintext envId — only safe for localhost.
x-signing-key: &signing-key "REPLACE_ME"

services:

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: featbit
      POSTGRES_PASSWORD: featbit_local_pw
      POSTGRES_DB: release_decision
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U featbit -d release_decision"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: featbit
      CLICKHOUSE_PASSWORD: featbit_local_pw
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      # CLICKHOUSE_DB pre-creates the database before the initdb scripts run,
      # so schema.sql's `CREATE DATABASE IF NOT EXISTS` becomes a no-op.
      CLICKHOUSE_DB: featbit
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ch_data:/var/lib/clickhouse
      # First-boot schema apply. clickhouse-server runs *.sql in this dir as
      # part of init when the data dir is empty. Idempotent on re-runs anyway
      # (uses IF NOT EXISTS), but only the first boot triggers it.
      - ./track-service/sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  track-service:
    image: featbit/featbit-rda-track-service:0.0.4-beta
    container_name: track-service
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - "5050:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ASPNETCORE_ENVIRONMENT: Production
      # If you change the CLICKHOUSE_USER/PASSWORD/DB above, update the
      # User/Password/Database fields here to match.
      CLICKHOUSE_CONNECTION_STRING: "Host=clickhouse;Port=8123;User=featbit;Password=featbit_local_pw;Protocol=http;Database=featbit"
      TRACK_SERVICE_SIGNING_KEY: *signing-key
      Ingest__ChannelCapacity: "100000"
      Ingest__BatchSize: "1000"
      Ingest__FlushIntervalMs: "5000"
      ClickHouse__Database: featbit
      ClickHouse__FlagEvaluationsTable: flag_evaluations
      ClickHouse__MetricEventsTable: metric_events
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Chat panel runs in two modes, selected per-browser by the web app itself:
  #   - Managed: web's `/api/sandbox0/*` routes proxy to sandbox0 Managed Agents
  #     (configure via SANDBOX0_API_KEY / SANDBOX0_BASE_URL below).
  #   - Local Claude Code: the user starts `@featbit/experimentation-claude-code-connector`
  #     on their own machine, the browser hits http://127.0.0.1:3100 directly.
  # No backend agent container is needed in compose.
  web:
    image: featbit/featbit-rda-web:0.0.4-beta
    container_name: web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      # If you change the POSTGRES_USER/PASSWORD/DB above, update this URL too.
      # The web entrypoint runs `prisma migrate deploy` on every start.
      DATABASE_URL: "postgresql://featbit:featbit_local_pw@postgres:5432/release_decision?sslmode=disable"
      # FeatBit backend the web app authenticates against. Defaults to FeatBit
      # SaaS; self-hosters of FeatBit replace this with their own API URL.
      # Server-side only — never sent to the browser.
      FEATBIT_API_URL: "https://app-api-experimentation.featbit.co"
      TRACK_SERVICE_URL: "http://track-service:8080"
      TRACK_SERVICE_SIGNING_KEY: *signing-key
      NODE_ENV: production
      # sandbox0 Managed Agents (the default chat backend in fresh browsers).
      # Without a key the chat panel returns 401 on first message — the rest
      # of the app still works.
      SANDBOX0_API_KEY: ""
      SANDBOX0_BASE_URL: "https://agents.sandbox0.ai"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  pg_data:
  ch_data:
