name: Release Charts

# Manual-only. Bump `charts/featbit-rda/Chart.yaml: version` before triggering —
# chart-releaser keys GitHub Releases by chart `version` (not `appVersion`),
# so reusing an existing version would 422. `skip_existing: true` is set so
# accidental re-runs no-op instead of failing the workflow.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        with:
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
